[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "portfolio-advisor"
version = "0.1.0"
description = "24/7 autonomous portfolio advisory system with multi-agent orchestration"
requires-python = ">=3.11"
dependencies = [
    "openai-agents>=0.7.0",
    "yfinance>=0.2.40",
    "aiosqlite>=0.20.0",
    "python-telegram-bot>=22.0",
    "apscheduler>=4.0.0a5",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "structlog>=24.0",
    "arch>=7.0",
    "hmmlearn>=0.3",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "fredapi>=0.5",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "ruff>=0.5",
]

[project.scripts]
portfolio-advisor = "portfolio_advisor.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio_advisor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: tests that require live API keys and network access",
]

[tool.ruff]
target-version = "py311"
line-length = 100
